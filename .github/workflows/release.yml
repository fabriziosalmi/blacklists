name: Generate and Publish Blacklists

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write  # Required for release creation
  id-token: write
  issues: write    # Required to report a failed release

# The daily build pushes statistics to main and publishes the release;
# two overlapping runs would race on both.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: main

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install tldextract tqdm

      # Fail before doing any work if the published attribution no longer
      # matches the sources actually being fetched.
      - name: Validate source registry
        run: python3 scripts/validate_registry.py

      # The attribution that ships with the release must match the registry the
      # pipeline fetches from. If it has drifted, the artifact would carry a
      # licence map describing sources it no longer uses.
      - name: Attribution documents match the registry
        run: python3 scripts/generate_licensing.py --check

      - name: Generate blacklist
        run: /bin/bash generate.sh  # Removed sudo

      # Attribute the aggregate back to its sources while the per-source
      # downloads are still on disk. Never allowed to block a release: a
      # statistics failure must not stop the blacklist from shipping.
      - name: Compute per-source statistics
        continue-on-error: true
        run: python3 scripts/source_stats.py

      # The currently published list, used by the gate to tell a newly blocked
      # domain apart from one that merely climbed the popularity ranking. Not
      # fatal if it cannot be fetched: the gate degrades to reporting that band
      # rather than blocking the release.
      - name: Fetch the published release for comparison
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download latest \
            --repo "${{ github.repository }}" \
            --pattern blacklist.txt \
            --output previous_blacklist.txt
          wc -l previous_blacklist.txt

      # Runs BEFORE anything is published. A release that blocks a DNS
      # resolver, an OS update endpoint or a CDN apex must not leave the runner,
      # because by the time anyone notices it is already installed.
      - name: Quality gate
        run: |
          python3 scripts/check_quality.py \
            --blacklist all.fqdn.blacklist \
            --previous previous_blacklist.txt

      # The review queue. Runs on a SUCCESSFUL release, because the popularity
      # check no longer blocks: without its own channel a new popular block
      # would be recorded in quality.json and seen by nobody, which is the
      # silence that let the list go stale for two weeks.
      #
      # One running issue, one comment per occurrence, so a busy week is a
      # thread to skim rather than a pile of issues to close.
      - name: Queue popular new blocks for review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PENDING=$(jq -r '.popularity.unacknowledged | length' stats/quality.json)
          if [ "$PENDING" = "0" ] || [ -z "$PENDING" ]; then
            echo "Nothing to review"
            exit 0
          fi

          # jq's // only substitutes for null and false, and join on an empty
          # array yields "", so the fallback has to be explicit or an entry with
          # no recorded source renders as a dangling "supplied by".
          LIST=$(jq -r '.popularity.unacknowledged[]
            | "- **#\(.rank) \(.domain)** - supplied by " +
              (if (.sources | length) > 0 then (.sources | join(", "))
               else "source unrecorded" end)' \
            stats/quality.json)

          BODY="$PENDING domain(s) in the global top 1000 were newly added to the list and have not been reviewed.

          $LIST

          This did **not** block the release — it is a judgement call, not a defect.

          For each one, either add it to \`whitelist.txt\` if it should not be blocked, or to \`sources/acknowledged.txt\` if it should. Acknowledged entries stop appearing here.

          Run: $RUN_URL"

          # The label is how the existing issue is found again. Without it every
          # occurrence opens a new issue, which is the pile this design avoids.
          gh label create review-queue --repo "${{ github.repository }}" \
            --color fbca04 --description "Popular domains newly blocked, awaiting review" \
            2>/dev/null || true

          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --state open --label review-queue --limit 1 --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Popular domains newly blocked - review queue" \
              --body "$BODY" --label review-queue
          fi

      # Classifies the published domains by content rather than by which source
      # supplied them, which is the only way a category no upstream declares
      # becomes visible. Reporting only.
      - name: Classify content
        continue-on-error: true
        run: python3 scripts/classify_content.py --blacklist all.fqdn.blacklist

      # Reports which whitelist entries are holding a source back today. Never
      # fails the build and never edits the file: a dormant entry is doing
      # exactly what it was added to do.
      - name: Whitelist report
        continue-on-error: true
        run: python3 scripts/whitelist_report.py

      # Kept non-fatal: a statistics problem must not stop the blacklist from
      # shipping. But "non-fatal" used to mean a rejected push vanished without
      # a trace, because continue-on-error hides the exit code and nothing
      # retried - so a day's statistics were simply lost. The retry makes the
      # ordinary cause (another workflow pushed to main first) self-healing, and
      # the final message says plainly that the data was dropped.
      - name: Commit statistics
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stats/sources.json stats/quality.json stats/whitelist.json stats/classification.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "📎 Update per-source and quality statistics [skip ci]"

          for attempt in 1 2 3; do
            if git push; then
              echo "✓ Statistics pushed (attempt $attempt)"
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing onto origin/main..."
            git pull --rebase --autostash origin main || break
          done

          echo "::warning::Could not push the per-source statistics after 3 attempts."
          echo "::warning::The release itself is unaffected; today's stats/*.json are not committed."
          exit 1

      - name: Remove downloaded source files
        if: always()
        run: rm -rf sources_raw previous_blacklist.txt

      - name: Prepare Blacklist Directory
        run: |
          mkdir -p blacklist_output

      - name: Extract and Prepare Original Blacklist
        run: |
          mv all.fqdn.blacklist blacklist_output/blacklist.txt
          # Keep the attribution header (leading '#' comment lines) on top and
          # sort/deduplicate only the domain body. This preserves the header
          # block and keeps the derived RPZ/Unbound assets valid (see SOURCES.md).
          grep -E '^[[:space:]]*#' blacklist_output/blacklist.txt > blacklist_output/header.txt || true
          grep -Ev '^[[:space:]]*#' blacklist_output/blacklist.txt | grep -Ev '^[[:space:]]*$' | sort -u > blacklist_output/body.txt
          cat blacklist_output/header.txt blacklist_output/body.txt > blacklist_output/blacklist.txt
          rm -f blacklist_output/header.txt blacklist_output/body.txt

      - name: Count domains in blacklist
        id: count_domains
        run: |
          # Count domains only, excluding the attribution header comment lines
          count=$(grep -Evc '^[[:space:]]*#' blacklist_output/blacklist.txt)
          echo "Number of domains: $count"
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Create RPZ Blacklist
        run: |
          # A response policy zone is a DNS zone, and a zone without SOA and NS
          # records is not one: named-checkzone rejects it and BIND refuses to
          # load the policy. The published file carried neither and began
          # straight with a CNAME record, so every RPZ user got a file their
          # resolver would not accept.
          #
          # SOA/NS are deliberately generic and the entries stay RELATIVE to the
          # origin, so the file works whatever the operator names the zone in
          # named.conf. "example.com CNAME ." inside zone rpz.blacklist is the
          # QNAME trigger for example.com, which is what RPZ expects.
          #
          # The '#' header of blacklist.txt is dropped because BIND comments
          # with ';', but the attribution itself is not: it is re-emitted below
          # in the syntax this format understands. Two of the three published
          # artifacts used to carry no attribution at all, while SOURCES.md and
          # the README claimed otherwise.
          serial=$(date -u '+%Y%m%d%H')
          {
            echo "; Aggregated by fabriziosalmi/blacklists from multiple third-party"
            echo "; sources under their respective licenses - see SOURCES.md"
            echo "; https://github.com/fabriziosalmi/blacklists/blob/main/SOURCES.md"
            echo "; Generated: $(date -u '+%Y-%m-%d') UTC"
            echo ';'
            echo '$TTL 60'
            echo "@ IN SOA localhost. root.localhost. ( ${serial} 3600 600 604800 60 )"
            echo "@ IN NS  localhost."
            awk '!/^[[:space:]]*#/ && NF {print $0 " CNAME ."}' blacklist_output/blacklist.txt
          } > rpz_blacklist.txt

      # A zone that does not load protects nobody. This is the check whose
      # absence let an unloadable artifact ship as a headline download.
      - name: Verify the RPZ zone loads
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bind9-utils >/dev/null
          named-checkzone -q rpz.blacklist rpz_blacklist.txt
          echo "✓ rpz_blacklist.txt is a loadable zone"

      - name: Create Unbound Blacklist
        run: |
          # A shell read loop appending per line reopened the output file 4.7
          # million times and took 89s of a 176s release - half the run, for the
          # same transformation the RPZ step does in awk in 2s. It also got
          # slower every day the list grew.
          #
          # The directives are wrapped in a "server:" clause because that is the
          # only context in which Unbound accepts local-zone. The file used to
          # emit them bare, so including it anywhere other than inside an
          # existing server: block was a parse error. Repeating the clause is
          # harmless - Unbound merges server: sections - so this is valid both
          # ways round.
          {
            echo "# Aggregated by fabriziosalmi/blacklists from multiple third-party"
            echo "# sources under their respective licenses - see SOURCES.md"
            echo "# https://github.com/fabriziosalmi/blacklists/blob/main/SOURCES.md"
            echo "# Generated: $(date -u '+%Y-%m-%d') UTC"
            echo "#"
            echo "# Include from unbound.conf:  include: \"unbound_blacklist.txt\""
            echo "server:"
            awk '!/^[[:space:]]*#/ && NF {printf "    local-zone: \"%s\" static\n", $0}' \
              blacklist_output/blacklist.txt
          } > unbound_blacklist.txt

      # Every artifact is built and verified before anything is published, and
      # the release is updated in place rather than deleted and recreated.
      #
      # The old sequence deleted the "latest" release and then created a new
      # one, which meant two things. Every download URL in every user's cron
      # returned 404 for the length of three uploads. And if any step after the
      # deletion failed - the RPZ build, an upload, a network blip - the previous
      # release was already gone and the new one did not exist, so the project
      # went from "yesterday's list" to "no list at all". The failure notice at
      # the end of this workflow claims the previous list stays in place; that
      # was only true before the deletion step ran.
      #
      # actions/create-release and actions/upload-release-asset were archived by
      # GitHub in 2021 and receive no fixes; gh is maintained and already used
      # elsewhere in this file.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Domains: ${{ steps.count_domains.outputs.count }}"

          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit latest --repo "${{ github.repository }}" \
              --title "Domains Blacklist" --notes "$NOTES"
          else
            gh release create latest --repo "${{ github.repository }}" \
              --title "Domains Blacklist" --notes "$NOTES"
          fi

          # --clobber replaces each asset in place, so a download in flight sees
          # either the old file or the new one, never a missing one.
          gh release upload latest --repo "${{ github.repository }}" --clobber \
            blacklist_output/blacklist.txt \
            rpz_blacklist.txt \
            unbound_blacklist.txt \
            NOTICES.txt \
            LICENSING.md

          gh release view latest --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "  published: \(.name) (\(.size) bytes)"'

      - name: Clean up
        run: rm -rf blacklist_output rpz_blacklist.txt unbound_blacklist.txt

      # A gate that stops the release protects users only if somebody finds out.
      # This one failed for fourteen consecutive nights without anyone noticing,
      # and the published list went stale for two weeks. A failed run now files
      # an issue, and reuses the open one so a long outage is a single thread
      # rather than a nightly pile.
      - name: Report a failed release
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Daily release is failing"
          gh label create release-failure --repo "${{ github.repository }}" \
            --color d73a4a --description "The scheduled release did not publish" \
            2>/dev/null || true

          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number')

          BODY="The scheduled release did not publish. The previously published list stays in place and is now getting older.

          Run: $RUN_URL

          Check the 'Quality gate' step first: it prints exactly which check failed and, for a source problem, which source stopped answering."

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --body "$BODY" --label release-failure
          fi
