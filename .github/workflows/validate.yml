name: Validate

# Guards the invariants that keep the published data honest:
#  - every fetched source has attribution and a licence on record
#  - SOURCES.md still matches the registry it is generated from
#  - the site build script is syntactically sound before it can break a deploy
on:
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'blacklists.fqdn.urls'
      - 'SOURCES.md'
      - 'LICENSING.md'
      - 'NOTICES.txt'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'sanitize.py'
      - 'whitelist.py'
      - 'whitelist.txt'
      - 'generate.sh'
      - 'requirements*.txt'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'sources/**'
      - 'blacklists.fqdn.urls'
      - 'SOURCES.md'
      - 'LICENSING.md'
      - 'NOTICES.txt'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'sanitize.py'
      - 'whitelist.py'
      - 'whitelist.txt'
      - 'generate.sh'
      - 'requirements*.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release runs on 3.12, so the tests do too.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      # Guards what the pipeline decides to block. Every case in the suite is a
      # bug that reached, or nearly reached, a published release.
      - name: Run tests
        run: python3 -m pytest tests/ -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Registry matches the fetched source list
        run: python3 scripts/validate_registry.py

      - name: SOURCES.md and README credits are up to date
        run: python3 scripts/generate_sources_md.py --check

      - name: LICENSING.md and NOTICES.txt are up to date
        run: python3 scripts/generate_licensing.py --check

      - name: whitelist.txt is normalised
        run: python3 scripts/format_whitelist.py --check

      - name: Scripts compile
        run: python3 -m compileall -q scripts/
