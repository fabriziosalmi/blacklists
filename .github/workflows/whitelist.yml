name: Validate and Sort whitelist.txt

on:
  push:
    paths:
      - 'whitelist.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Comments in whitelist.txt are data: they record why an entry exists.
      # A previous shell version of this step validated every line against an
      # FQDN regex and kept only what matched, so the day entries gained trailing
      # comments it deleted 384 of them - every entry that was actively holding a
      # source back, a DNS resolver and a CDN apex among them. The normaliser
      # preserves comments and reports anything it drops.
      - name: Normalise whitelist.txt
        run: python3 scripts/format_whitelist.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add whitelist.txt
          if git diff --staged --quiet; then
            echo "whitelist.txt already normalised"
          else
            git commit -m "Normalise whitelist.txt [skip ci]"
            git push
          fi
