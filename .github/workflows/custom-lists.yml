name: Normalise custom lists

on:
  push:
    paths:
      - 'custom/streaming.txt'
  workflow_dispatch:

permissions:
  contents: write

# custom/streaming.txt is also fetched as a source by the release pipeline, so
# two runs racing each other would push conflicting normalisations of a file the
# build reads.
concurrency:
  group: custom-lists
  cancel-in-progress: false

jobs:
  clean-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Process file
        id: process_file
        run: |
          FILE_PATH="custom/streaming.txt"
          TEMP_FILE="$(mktemp)"

          # Lowercase first, then sort and deduplicate. The previous order was
          # "sort -u -f" followed by tr, which picked whichever case happened to
          # sort first and only then folded it - so the surviving entry depended
          # on input order rather than on the content.
          tr '[:upper:]' '[:lower:]' < "$FILE_PATH" | sed '/^[[:space:]]*$/d' | sort -u > "$TEMP_FILE"

          # $GITHUB_OUTPUT, not ::set-output. The workflow command was deprecated
          # by GitHub and is being disabled; once it stops being honoured the
          # output is empty, the commit step's condition never matches, and this
          # job silently stops normalising the file while still reporting success.
          if cmp --silent "$FILE_PATH" "$TEMP_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "custom/streaming.txt already normalised"
          else
            mv "$TEMP_FILE" "$FILE_PATH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "custom/streaming.txt normalised ($(wc -l < "$FILE_PATH") entries)"
          fi

      - name: Commit and push changes
        if: steps.process_file.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom/streaming.txt
          git commit -m "Normalise custom/streaming.txt [skip ci]"
          git push
