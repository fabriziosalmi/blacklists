version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # The Python locks (requirements*.txt) are pinned with hashes, so nothing
  # moves unless a pull request moves it.
  - package-ecosystem: "pip"
    directory: "/"
    # Dependabot reads every .txt file in the root as a requirements file.
    # These are lists of domains and notices, not dependencies.
    exclude-paths:
      - "whitelist.txt"
      - "dns_servers.txt"
      - "NOTICES.txt"
    schedule:
      interval: "weekly"
